# Production stack. `docker compose up -d` is all it takes once .env is filled.
#
# Local development needs two extra things (the dev-only Meilisearch and the
# fastmart-pro.test host mapping) — those live in docker-compose.dev.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  n8n:
    image: n8nio/n8n:2.37.6
    container_name: fastmart-n8n
    restart: unless-stopped
    logging: *default-logging
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-true}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:-}
      - N8N_RUNNERS_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=http,https,util,path,url,zlib,crypto,stream,events
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-fastmart_n8n}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_password}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Dhaka}
      - TZ=${TZ:-Asia/Dhaka}
      - STORE_BASE_URL=${STORE_BASE_URL:-https://example.com}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # ===== n8n Assistant (instance-ai module) =====
      # Model: any OpenAI-compatible endpoint. Defaults to Command Code's gateway.
      # The "custom/" prefix is required: instance-ai reads the text before the
      # first "/" as an n8n provider name, so a namespaced gateway id like
      # "deepseek/deepseek-v4.1-flash" would be stripped to "deepseek-v4.1-flash".
      - N8N_ENABLED_MODULES=${N8N_ENABLED_MODULES:-instance-ai}
      - N8N_INSTANCE_AI_MODEL=${N8N_INSTANCE_AI_MODEL:-custom/deepseek/deepseek-v4.1-flash}
      - N8N_INSTANCE_AI_MODEL_API_KEY=${N8N_INSTANCE_AI_MODEL_API_KEY:-}
      # Endpoint for the model above. Required for "custom/" (its baseURL).
      - N8N_INSTANCE_AI_MODEL_URL=${N8N_INSTANCE_AI_MODEL_URL:-https://api.commandcode.ai/provider/v1}
      # Sandbox (self-hosted n8n-sandbox) — required for n8n Assistant.
      - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
      - N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
      - N8N_INSTANCE_AI_SANDBOX_IMAGE=${N8N_INSTANCE_AI_SANDBOX_IMAGE:-ghcr.io/n8n-io/n8n-sandbox-service-sandbox:latest}
      - N8N_INSTANCE_AI_SANDBOX_API_URL=http://sandbox-api:8080
      - N8N_SANDBOX_SERVICE_URL=http://sandbox-api:8080
      - N8N_SANDBOX_SERVICE_API_KEY=${SANDBOX_API_KEYS:-}
      # Web search (bundled SearXNG)
      - N8N_INSTANCE_AI_SEARXNG_URL=http://searxng:8080
    # Loopback only: the host reverse proxy (aaPanel's Nginx) reaches n8n here,
    # the internet never does. Set N8N_BIND=0.0.0.0 to expose it directly.
    ports:
      - "${N8N_BIND:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-api:
        condition: service_healthy
    networks:
      - fastmart

  postgres:
    image: postgres:16-alpine
    container_name: fastmart-n8n-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-fastmart_n8n}
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-fastmart_n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fastmart

  # ===== n8n Assistant sandbox (self-hosted, "Setup 2") =====
  # Generates the mTLS certs the sandbox-api and runner need, then exits.
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.2.0
    container_name: fastmart-sandbox-certs
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - sandbox-tls:/tls
    networks:
      - fastmart

  # Control plane n8n talks to when n8n Assistant runs code. Internal only.
  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.2.0
    container_name: fastmart-sandbox-api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      # Only the secrets the sandbox needs (never env_file: .env — keeps the
      # model key, Postgres password and n8n encryption key out of this container).
      - SANDBOX_API_KEYS=${SANDBOX_API_KEYS}
      - SANDBOX_API_RUNNER_REGISTRATION_TOKEN=${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      - SANDBOX_API_RUNNER_API_KEY=${SANDBOX_API_RUNNER_API_KEY}
      - SANDBOX_API_GRPC_TLS_CERT_FILE=/tls/api/grpc-server.crt
      - SANDBOX_API_GRPC_TLS_KEY_FILE=/tls/api/grpc-server.key
      - SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE=/tls/api/ca.crt
      - SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE=/tls/api/ca.crt
      - SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE=/tls/api/control-grpc-api-client.crt
      - SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE=/tls/api/control-grpc-api-client.key
      - SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME=sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - fastmart
    # Never publish 8080/9090 to the host. n8n reaches this by service name.

  # Privileged Docker-in-Docker worker that creates/runs the actual sandboxes.
  # Treat as root on the host — never publish its ports.
  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:1.2.0
    container_name: fastmart-sandbox-runner-1
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      - SANDBOX_RUNNER_API_KEYS=${SANDBOX_API_RUNNER_API_KEY}
      - SANDBOX_RUNNER_REGISTRATION_TOKEN=${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      - SANDBOX_RUNNER_API_GRPC_ADDR=sandbox-api:9090
      - SANDBOX_RUNNER_HTTP_BASE_URL=http://sandbox-runner-1:8080
      - SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR=:9091
      - SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR=sandbox-runner-1:9091
      - SANDBOX_RUNNER_ID=runner-1
      - SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE=${N8N_INSTANCE_AI_SANDBOX_IMAGE:-ghcr.io/n8n-io/n8n-sandbox-service-sandbox:latest}
      - SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE=/tls/runner/ca.crt
      - SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE=/tls/runner/grpc-client.crt
      - SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE=/tls/runner/grpc-client.key
      - SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME=sandbox-api
      - SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE=/tls/runner/control-grpc-server.crt
      - SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE=/tls/runner/control-grpc-server.key
      - SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE=/tls/runner/ca.crt
    volumes:
      - sandbox-tls:/tls:ro
    networks:
      - fastmart

  # Bundled web search for n8n Assistant. Internal only.
  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: fastmart-searxng
    restart: unless-stopped
    logging: *default-logging
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - fastmart

  # Fixes Gemini 3 multi-step tool calling for n8n Assistant: caches the
  # thought_signature Gemini returns on each tool call and re-attaches it on the
  # next request. Internal only.
  gemini-sig-proxy:
    image: node:22-alpine
    container_name: fastmart-gemini-sig-proxy
    restart: unless-stopped
    logging: *default-logging
    command: ['node', '/app/gemini-sig-proxy.mjs']
    environment:
      - PORT=8017
      - GEMINI_UPSTREAM=${GEMINI_UPSTREAM:-https://generativelanguage.googleapis.com/v1beta/openai}
    volumes:
      - ./gemini-sig-proxy.mjs:/app/gemini-sig-proxy.mjs:ro
    networks:
      - fastmart

volumes:
  n8n_data:
  postgres_data:
  sandbox-tls:

networks:
  fastmart:
    driver: bridge
